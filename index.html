<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Home Battery Profitability Calculator</h1>
    <form id="batteryForm" onsubmit="event.preventDefault(); calculateProfitability();">
        <label>Battery Cost ($): <input type="number" id="batteryCost" required></label><br><br>
        <label>Battery Capacity (kWh): <input type="number" id="batteryCapacity" required></label><br><br>
        <label>Average Daily Usage (kWh): <input type="number" id="dailyUsage" required></label><br><br>
        <label>Electricity Rate Without Battery ($/kWh): <input type="number" step="0.01" id="rateWithout" required></label><br><br>
        <label>Electricity Rate With Battery ($/kWh): <input type="number" step="0.01" id="rateWith" required></label><br><br>
        <label>Battery Lifespan (years): <input type="number" id="lifespan" required></label><br><br>
        <label>Annual Maintenance Cost ($): <input type="number" id="maintenance" value="0"></label><br><br>
        <button type="submit">Calculate</button>
    </form>
    <div id="result" style="margin-top:2rem;"></div>
    <script src="main.js"></script>
</body>
</html>
